{"name":"Build ShiftCash","on":{"push":{"branches":["main","master"]},"pull_request":null,"workflow_dispatch":null},"permissions":{"contents":"write","pages":"write","id-token":"write"},"concurrency":{"group":"build-${{ github.ref }}","cancel-in-progress":true},"jobs":{"test-and-web":{"name":"Tests + web build","runs-on":"ubuntu-latest","timeout-minutes":20,"steps":[{"uses":"actions/checkout@v4"},{"name":"Unpack shiftcash-source.zip (found anywhere in the repository)","run":"Z=$(find . -iname 'shiftcash-source*.zip' -not -path './node_modules/*' -printf '%T@ %p\\n' | sort -nr | head -1 | cut -d' ' -f2-)\nif [ -n \"$Z\" ]; then\n  unzip -o -q \"$Z\" -d .\n  echo \"Using files from $Z\"\nfi\ntest -f package.json || { echo \"::error::package.json not found. Upload shiftcash-source.zip to the repository.\"; exit 1; }\n"},{"uses":"actions/setup-node@v4","with":{"node-version":22}},{"name":"Install dependencies","run":"npm install --no-audit --no-fund"},{"name":"Accounting + SQLite storage + backup tests","run":"npm test"},{"name":"Build web / PWA version","run":"node scripts/build-web.mjs"},{"name":"Install headless Chromium","run":"npx playwright install --with-deps chromium"},{"name":"Browser end-to-end test (incl. offline reopen)","continue-on-error":true,"run":"node tests/e2e-simple.mjs && node tests/e2e.mjs"},{"name":"Upload web build","uses":"actions/upload-artifact@v4","with":{"name":"shiftcash-web","path":"dist/web","include-hidden-files":true}},{"name":"Prepare GitHub Pages site","if":"github.event_name != 'pull_request'","uses":"actions/upload-pages-artifact@v3","with":{"path":"dist/web"}},{"name":"Upload test screenshots","if":"always()","uses":"actions/upload-artifact@v4","with":{"name":"test-screenshots","path":"dist/screenshots","if-no-files-found":"ignore"}}]},"pages":{"name":"Publish web app (GitHub Pages)","if":"github.event_name != 'pull_request'","needs":"test-and-web","runs-on":"ubuntu-latest","continue-on-error":true,"environment":{"name":"github-pages","url":"${{ steps.deploy.outputs.page_url }}"},"steps":[{"name":"Deploy","id":"deploy","uses":"actions/deploy-pages@v4"}]},"android":{"name":"Android APK","needs":"test-and-web","runs-on":"ubuntu-latest","timeout-minutes":40,"env":{"VERSION_CODE":"${{ github.run_number }}","HAS_RELEASE_KEY":"${{ secrets.SHIFTCASH_KEYSTORE_BASE64 != '' }}"},"steps":[{"uses":"actions/checkout@v4"},{"name":"Unpack shiftcash-source.zip (found anywhere in the repository)","run":"Z=$(find . -iname 'shiftcash-source*.zip' -not -path './node_modules/*' -printf '%T@ %p\\n' | sort -nr | head -1 | cut -d' ' -f2-)\nif [ -n \"$Z\" ]; then\n  unzip -o -q \"$Z\" -d .\n  echo \"Using files from $Z\"\nfi\ntest -f package.json || { echo \"::error::package.json not found. Upload shiftcash-source.zip to the repository.\"; exit 1; }\n"},{"uses":"actions/setup-node@v4","with":{"node-version":22}},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":21}},{"name":"Set up Android SDK","uses":"android-actions/setup-android@v3"},{"name":"Install dependencies","run":"npm install --no-audit --no-fund"},{"name":"Generate + sync Capacitor Android project","run":"node scripts/android-setup.mjs"},{"name":"Build debug APK","working-directory":"android","run":"chmod +x gradlew\n./gradlew assembleDebug --no-daemon --stacktrace\n"},{"name":"Name debug APK","run":"mkdir -p out\ncp android/app/build/outputs/apk/debug/app-debug.apk \"out/ShiftCash-debug-v$(node -p \"require('./package.json').version\")-build${{ github.run_number }}.apk\"\nls -la out\n"},{"name":"Upload debug APK","uses":"actions/upload-artifact@v4","with":{"name":"shiftcash-debug-apk","path":"out/*.apk"}},{"name":"Publish debug APK to the \"latest-debug\" release (direct download link)","if":"github.event_name != 'pull_request'","env":{"GH_TOKEN":"${{ github.token }}"},"run":"gh release delete latest-debug --yes --cleanup-tag || true\ngh release create latest-debug out/*.apk \\\n  --prerelease \\\n  --title \"ShiftCash test build ${{ github.run_number }}\" \\\n  --notes \"Debug/test APK built automatically from commit ${{ github.sha }}. Installs as 'ShiftCash' (com.shiftcash.app.debug). Each new test build updates the previous one in place and keeps your data.\"\n"},{"name":"Build signed release APK","id":"release","if":"${{ env.HAS_RELEASE_KEY == 'true' }}","env":{"SHIFTCASH_KEYSTORE_PASSWORD":"${{ secrets.SHIFTCASH_KEYSTORE_PASSWORD }}","SHIFTCASH_KEY_ALIAS":"${{ secrets.SHIFTCASH_KEY_ALIAS }}","SHIFTCASH_KEY_PASSWORD":"${{ secrets.SHIFTCASH_KEY_PASSWORD }}"},"run":"echo \"${{ secrets.SHIFTCASH_KEYSTORE_BASE64 }}\" | base64 -d > \"$RUNNER_TEMP/release.jks\"\nexport SHIFTCASH_KEYSTORE_FILE=\"$RUNNER_TEMP/release.jks\"\ncd android && ./gradlew assembleRelease --no-daemon --stacktrace\ncd .. && cp android/app/build/outputs/apk/release/app-release.apk \"out/ShiftCash-v$(node -p \"require('./package.json').version\").apk\"\nrm -f \"$RUNNER_TEMP/release.jks\"\n"},{"name":"Upload release APK","if":"${{ steps.release.outcome == 'success' }}","uses":"actions/upload-artifact@v4","with":{"name":"shiftcash-release-apk","path":"out/ShiftCash-v*.apk"}}]}}}

